<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriGes — Gestion Agricole Complète & Boutique</title>
<style>
/* ================= DESIGN TOKENS ================= */
:root{
  --green:#16a34a; --green-d:#14532d; --green-x:#052e16;
  --amber:#f59e0b; --red:#dc2626; --red-l:#fee2e2;
  --bg:#f0f4f0; --card:#ffffff; --text:#16211a; --muted:#64748b;
  --border:#dbe5db; --radius:14px;
  --shadow:0 4px 18px rgba(20,83,45,.10);
  --glow:0 0 22px rgba(22,163,74,.35);
  --sidebar-w:264px;
  --pub-pri:#16a34a; --pub-pri2:#052e16; --pub-acc:#f59e0b;
  --pub-radius:14px; --pub-btn:gradient; --pub-font:'Segoe UI',Roboto,Arial;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
img{max-width:100%}
a{color:var(--green);text-decoration:none}
.hidden{display:none!important}
::selection{background:var(--green);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#eef2ee}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#22c55e,#14532d);border-radius:8px}
/* ================= BOUTONS ================= */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;transition:transform .15s,box-shadow .2s,filter .15s;background:#e2e8f0;color:#0f172a;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .5s}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn:active{transform:translateY(0) scale(.97)}
.btn-p{background:linear-gradient(135deg,#16a34a,#14532d);color:#fff;box-shadow:0 4px 14px rgba(22,163,74,.35)}
.btn-p:hover{box-shadow:var(--glow)}
.btn-d{background:linear-gradient(135deg,#ef4444,#991b1b);color:#fff}
.btn-a{background:linear-gradient(135deg,#fbbf24,#d97706);color:#422006}
.btn-b{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
.btn-o{background:#fff;border:1.5px solid var(--border);color:var(--text)}
.btn-s{padding:5px 10px;font-size:12.5px}.btn-x{padding:2px 8px;font-size:12px}
/* ================= CONNEXION ================= */
#loginView{min-height:100vh}
.login-card{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-radius:20px;box-shadow:0 18px 60px rgba(0,0,0,.35);width:100%;max-width:400px;padding:34px 28px;text-align:center;border:1px solid rgba(255,255,255,.6);animation:fadeSlideIn .5s ease}
.login-card .logo-box{width:80px;height:80px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#dcfce7,#bbf7d0);display:flex;align-items:center;justify-content:center;font-size:40px;animation:floatY 4s ease-in-out infinite}
.login-card h1{font-size:21px;color:var(--green-d)}
.login-card p{color:var(--muted);font-size:13px;margin:4px 0 18px}
/* ================= SITE PUBLIC ================= */
.pub-nav{position:sticky;top:0;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;background:rgba(5,46,22,.75);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12);transition:.3s}
.pub-nav.scrolled{background:rgba(5,46,22,.95);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.pub-nav .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px}
.pub-nav .brand .lg{width:40px;height:40px;border-radius:10px;background:#fff;object-fit:contain;padding:3px}
.pub-links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:60vw}
.pub-links::-webkit-scrollbar{display:none}
.pub-links a{color:#d9f2e2;padding:8px 14px;border-radius:20px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.2s;position:relative}
.pub-links a:hover{color:#fff;background:rgba(255,255,255,.12);transform:translateY(-2px)}
.pub-hero{position:relative;min-height:92vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:#fff}
.pub-hero .bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--pub-pri2),var(--pub-pri) 60%,#65a30d);background-size:200% 200%;animation:gradientMove 12s ease infinite}
.pub-hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28;mix-blend-mode:luminosity}
.pub-hero .overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(3,20,10,.75) 90%)}
.pub-hero .inner{position:relative;z-index:5;max-width:880px;padding:40px 20px;animation:fadeSlideIn .8s ease}
.pub-hero h1{font-size:clamp(30px,5.4vw,58px);font-weight:900;line-height:1.12;text-shadow:0 6px 30px rgba(0,0,0,.4)}
.pub-hero h1 .grad{background:linear-gradient(90deg,#fde68a,#fbbf24,#a3e635);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hueShift 8s linear infinite}
.pub-hero p.sub{font-size:clamp(14px,2vw,19px);margin:16px auto 26px;max-width:640px;color:#e7f8ec}
.float-ic{position:absolute;font-size:34px;opacity:.5;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));animation:floatY 6s ease-in-out infinite;z-index:2;user-select:none}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-26px) rotate(6deg)}}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes hueShift{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(40deg)}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}50%{box-shadow:0 0 0 14px rgba(22,163,74,0)}}
.marquee-band{overflow:hidden;background:linear-gradient(90deg,var(--pub-pri),#65a30d);padding:12px 0;white-space:nowrap;position:relative}
.marquee-band .track{display:inline-flex;gap:44px;animation:marquee 26s linear infinite;font-weight:700;color:#fff;font-size:15px}
.pub-section{padding:64px 20px;max-width:1180px;margin:0 auto}
.pub-section h2{font-size:clamp(22px,3.4vw,34px);color:var(--pub-pri2);text-align:center;margin-bottom:6px}
.pub-section .lead{text-align:center;color:var(--muted);max-width:640px;margin:0 auto 34px}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.act-card{background:var(--card);border-radius:18px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--border);transition:.3s;position:relative;overflow:hidden;cursor:pointer}
.act-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--pub-pri),var(--pub-acc));transform:scaleX(0);transition:.35s;transform-origin:left}
.act-card:hover{transform:translateY(-8px);box-shadow:0 18px 40px rgba(20,83,45,.18)}
.act-card:hover::before{transform:scaleX(1)}
.act-card .ic{font-size:40px;display:inline-block;transition:.4s}
.act-card:hover .ic{transform:scale(1.25) rotate(-8deg)}
.act-card h3{color:var(--pub-pri2);margin:10px 0 6px;font-size:16.5px}
.act-card p{color:var(--muted);font-size:13px}
.act-card .more{max-height:0;overflow:hidden;transition:max-height .45s ease;color:#334155;font-size:12.5px}
.act-card:hover .more{max-height:220px}
.pub-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pub-gallery figure{margin:0;position:relative;border-radius:14px;overflow:hidden;cursor:pointer;animation:fadeSlideIn .6s ease both}
.pub-gallery img{width:100%;height:170px;object-fit:cover;transition:transform .5s}
.pub-gallery figure:hover img{transform:scale(1.12)}
.pub-gallery figcaption{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:.3s}
.pub-gallery figure:hover figcaption{opacity:1}
.pub-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pub-prod .p{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:.3s;border:1px solid var(--border)}
.pub-prod .p:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(20,83,45,.16)}
.pub-prod img{width:100%;height:150px;object-fit:cover}
.pub-prod .b{padding:12px}
.pub-prod .pr{color:var(--pub-pri);font-weight:800;font-size:16px}
.pub-prod .un{font-size:11.5px;color:var(--muted)}
.pub-prod .frz{display:inline-block;background:#e0f2fe;color:#0369a1;font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:700}
.pub-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 30px;border-radius:var(--pub-radius);font-weight:800;font-size:15px;cursor:pointer;border:none;transition:.25s;text-decoration:none}
.pub-btn.pri{color:#fff;background:linear-gradient(135deg,var(--pub-pri),var(--pub-pri2));box-shadow:0 8px 24px rgba(22,163,74,.4)}
.pub-btn.pri:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 34px rgba(22,163,74,.5)}
.pub-btn.out{background:transparent;border:2px solid rgba(255,255,255,.7);color:#fff}
.pub-btn.out:hover{background:rgba(255,255,255,.15);transform:translateY(-3px)}
.pub-btn.amber{background:linear-gradient(135deg,#fbbf24,#d97706);color:#422006}
.pub-stats{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-top:34px}
.pub-stats .st{text-align:center}
.pub-stats .st .n{font-size:30px;font-weight:900;color:#fde68a}
.pub-stats .st .l{font-size:12.5px;color:#d9f2e2}
.news-card{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);border-left:5px solid var(--pub-pri);transition:.25s}
.news-card:hover{transform:translateX(6px)}
.pub-footer{background:var(--pub-pri2);color:#c8e6d2;padding:34px 22px;text-align:center;font-size:13px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 80px rgba(0,0,0,.6);animation:popIn .25s}
/* ================= PORTAIL DE GESTION ================= */
#appView{display:none;min-height:100vh}
aside#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,#04170c,#0a2e18 55%,#14532d);color:#d9f2e2;overflow-y:auto;z-index:60;transition:transform .3s;box-shadow:4px 0 30px rgba(0,0,0,.25)}
.sidebar-head{padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.sidebar-head img{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;box-shadow:0 0 14px rgba(163,230,53,.4)}
.sidebar-head .t1{font-weight:800;font-size:14.5px;line-height:1.2;color:#fff}
.sidebar-head .t2{font-size:11px;opacity:.75}
.nav-group{margin-top:8px}
.nav-group>.nav-title{padding:8px 16px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.55;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 16px;color:#c8e6d2;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;transition:.2s;position:relative}
.nav-item:hover{background:rgba(255,255,255,.08);transform:translateX(4px);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(163,230,53,.22),transparent);border-left-color:#a3e635;color:#fff;font-weight:700}
.nav-item .ic{width:22px;text-align:center;font-size:15px}
main#main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap}
#burger{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--green-d)}
#globalSearch{flex:1;min-width:180px;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--border);border-radius:22px;padding:7px 14px;transition:.2s}
#globalSearch:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
#globalSearch input{border:none;background:none;outline:none;width:100%;font-size:13.5px}
.top-select{border:1.5px solid var(--border);border-radius:9px;padding:6px 8px;font-size:12.5px;background:#fff;max-width:170px}
#alertBtn{position:relative;background:linear-gradient(135deg,#fef3c7,#fde68a);border:none;font-size:19px;cursor:pointer;border-radius:10px;padding:5px 9px;transition:.2s}
#alertBtn:hover{transform:scale(1.1)}
#alertCount{position:absolute;top:-5px;right:-6px;background:var(--red);color:#fff;font-size:10px;border-radius:50%;padding:1px 5px;font-weight:800;animation:pulseGlow 2s infinite}
#userChip{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-radius:22px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--green-d)}
#userChip .avatar{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#14532d);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 0 10px rgba(22,163,74,.5)}
#view{padding:20px;flex:1;max-width:1520px;width:100%;margin:0 auto}
.view-anim{animation:fadeSlideIn .35s ease}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:20px;color:var(--green-d);display:flex;align-items:center;gap:9px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:13px;margin-bottom:16px}
.stat-card{background:linear-gradient(160deg,#fff,#f6fbf6);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;border-left:4px solid var(--green);cursor:pointer;transition:.22s;position:relative;overflow:hidden}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(20,83,45,.16)}
.stat-card .lb{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-card .vl{font-size:22px;font-weight:800;color:var(--green-d);margin-top:2px}
.stat-card .sb{font-size:11.5px;color:var(--muted)}
.stat-card.amber{border-left-color:var(--amber)}.stat-card.red{border-left-color:var(--red)}.stat-card.blue{border-left-color:#2563eb}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;margin-bottom:16px;animation:fadeSlideIn .3s ease}
.panel h3{font-size:15px;color:var(--green-d);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{background:linear-gradient(135deg,#14532d,#166534);color:#fff;text-align:left;padding:9px 10px;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:#f2fbf3}
.tbl .thumb{width:38px;height:38px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:700;background:#e2e8f0;color:#334155}
.badge.g{background:#dcfce7;color:#14532d}.badge.r{background:var(--red-l);color:var(--red)}.badge.a{background:#fef3c7;color:#92400e}.badge.b{background:#dbeafe;color:#1d4ed8}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar input[type=text],.toolbar select{padding:8px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:#fff}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12.5px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(8,25,14,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:popIn .2s}
.modal.wide{max-width:920px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#f0fdf4,#fff)}
.modal-head h3{font-size:16px;color:var(--green-d)}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);transition:.2s}
.modal-close:hover{transform:rotate(90deg);color:var(--red)}
.modal-body{padding:18px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.fg label{font-size:12px;font-weight:700;color:#334155}
.fg label .req{color:var(--red)}
.fg input,.fg select,.fg textarea{padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff;transition:.15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
.fg textarea{resize:vertical;min-height:64px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs .th{position:relative}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--border)}
.thumbs .rm{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-msg{background:#0f172a;color:#fff;padding:11px 20px;border-radius:26px;font-size:13.5px;box-shadow:0 8px 26px rgba(0,0,0,.35);animation:popIn .2s}
.toast-msg.err{background:linear-gradient(135deg,#ef4444,#991b1b)}.toast-msg.ok{background:linear-gradient(135deg,#16a34a,#14532d)}
.alert-item{display:flex;gap:10px;padding:9px 6px;border-bottom:1px solid var(--border);font-size:13px;align-items:flex-start;cursor:pointer;transition:.15s}
.alert-item:hover{background:#f0fdf4;transform:translateX(4px)}
.alert-item .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0}
.alert-item .dot.r{background:var(--red)}.alert-item .dot.a{background:var(--amber)}.alert-item .dot.g{background:var(--green)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv b{color:var(--green-d)}
.progress{height:9px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:6px;transition:width .6s}
.tag{font-size:11px;background:#dcfce7;color:#14532d;padding:2px 9px;border-radius:11px;font-weight:700}
.searchres{border:1.5px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;flex-wrap:wrap;transition:.15s}
.searchres:hover{border-color:var(--green);box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.checkline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}
.colorbox{width:42px;height:30px;padding:2px!important;cursor:pointer}
#sideOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
/* ===== Design System : X · Canva · Microsoft · Facebook ===== */
/* Microsoft Fluent : ombres en couches, acrylique, focus rings */
.panel,.act-card,.stat-card{box-shadow:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.11)}
.btn:focus-visible,.pub-btn:focus-visible{outline:2px solid #0f6cbd;outline-offset:2px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#0f6cbd;box-shadow:0 0 0 2px rgba(15,108,189,.25)}
/* X : noir, contraste, typographie serrée */
.pub-hero h1{font-weight:900;letter-spacing:-.02em}
.pub-footer{background:#000}
/* Facebook : cartes rondes, bleu d'interaction */
.news-card,.pub-prod .p{border-radius:16px}
.pub-links a:hover{background:rgba(24,119,242,.25);color:#fff}
/* Canva : dégradés joyeux */
.pub-btn.pri{background:linear-gradient(135deg,var(--pub-pri),var(--pub-acc) 130%)}
/* Formes de boutons paramétrables */
body[data-pub-btn="pill"] .pub-btn{border-radius:999px}
body[data-pub-btn="rounded"] .pub-btn{border-radius:var(--pub-radius)}
body[data-pub-btn="square"] .pub-btn{border-radius:4px}
body[data-pub-btn="flat"] .pub-btn{border-radius:0;box-shadow:none}
/* Niveaux d'animation */
body[data-anim="subtle"] .float-ic{animation-duration:11s;opacity:.35}
body[data-anim="subtle"] .marquee-band .track{animation-duration:60s}
body[data-anim="rich"] .float-ic{animation-duration:5s}
body[data-anim="rich"] .act-card{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
/* Fond global du site vitrine */
#publicSite{background-image:linear-gradient(rgba(255,255,255,.96),rgba(255,255,255,.96)),var(--pub-bg,none);background-size:cover;background-attachment:fixed}
/* ---- Boutique / POS ---- */
.pos-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;max-height:62vh;overflow-y:auto;padding:4px}
.prod-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.18s;position:relative}
.prod-card:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,83,45,.14)}
.prod-card img{width:100%;height:72px;object-fit:cover;border-radius:8px}
.prod-card .pn{font-size:12px;font-weight:700;margin-top:6px;min-height:28px}
.prod-card .pp{color:var(--green-d);font-weight:800;font-size:13px}
.prod-card .stk{font-size:10.5px;color:var(--muted)}
.prod-card.out{opacity:.5;pointer-events:none}
.prod-card .frz{position:absolute;top:6px;left:6px;background:#e0f2fe;color:#0369a1;font-size:9.5px;padding:1px 6px;border-radius:8px;font-weight:800}
.cart-box{position:sticky;top:70px}
.cart-table{width:100%;border-collapse:collapse;font-size:12.5px}
.cart-table th{background:#14532d;color:#fff;padding:6px 8px;text-align:left}
.cart-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
.cart-table input{width:56px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px}
.cart-total{font-size:22px;font-weight:900;color:var(--green-d);text-align:right;margin:8px 0}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:1024px){
  aside#sidebar{transform:translateX(-100%)}
  aside#sidebar.open{transform:translateX(0)}
  #sideOverlay.show{display:block}
  main#main{margin-left:0}
  #burger{display:block}
  .grid2{grid-template-columns:1fr}
  .pos-grid{grid-template-columns:1fr}
  .cart-box{position:static}
}
@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  #view{padding:12px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .stat-card .vl{font-size:18px}
  .page-head h2{font-size:16px}
  .modal-body{padding:12px}
  .pub-links{max-width:100%}
}
@media print{aside#sidebar,#topbar,.toolbar,.pager,.btn,#toast{display:none!important}main#main{margin:0}.panel,.stat-card{box-shadow:none}}

<script>
"use strict";
/* ================================================================
   AGRIGES v2 — Moteur monofichier.
   Refonte : site vitrine futuriste paramétrable, boutique POS
   complète (caisse/stock/factures/scanner), permissions RH en
   ligne, QR codes traçables, signature unique, permissions durcies.
   ================================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const nowStr=()=>new Date().toLocaleString('fr-FR');
const fmt=n=>(Number(n)||0).toLocaleString('fr-FR');
const fmtM=n=>fmt(n)+' FCFA';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
const yearOf=d=>d?String(d).slice(0,4):'';
function ageCalc(d){if(!d)return '';const t=Date.now()-new Date(d).getTime();if(t<0)return '';const y=Math.floor(t/31557600000),m=Math.floor(t/2629800000)%12;return y>0?y+' an'+(y>1?'s':'')+(m>0?' '+m+' m':'')+'ois':m>0?m+' mois':Math.max(1,Math.floor(t/86400000))+' j';}
function toast(msg,type){const t=document.createElement('div');t.className='toast-msg '+(type||'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2800);}
function stripHTML(s){const d=document.createElement('div');d.innerHTML=String(s);return d.textContent||'';}
function downloadFile(content,name,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
/* ================================================================
   GÉNÉRATEUR QR CODE 100% LOCAL (hors-ligne) — ISO 18004
   Byte mode, versions 1-5, correction L/M, masque 0.
   Validé : flux de données extrait inversement conforme,
   infos de format = constante standard 0x5412, RS recalculé.
   ================================================================ */
(function(){
const EXP=new Uint8Array(512),LOG=new Uint8Array(256);
(function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11d;}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
function gmul(a,b){return(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];}
function rsGen(n){let g=[1];for(let i=0;i<n;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=gmul(g[j],EXP[i]);ng[j+1]^=g[j];}g=ng;}return g;}
function rsEnc(data,n){const g=rsGen(n);const res=data.slice();for(let i=0;i<n;i++)res.push(0);
  for(let i=0;i<data.length;i++){const c=res[i];if(c!==0)for(let j=0;j<g.length;j++)res[i+j]^=gmul(g[j],c);}
  return res.slice(data.length);}
const VER=[{v:1,size:21,dataL:19,dataM:16,ecL:7,ecM:10,align:null},
 {v:2,size:25,dataL:34,dataM:28,ecL:10,ecM:16,align:18},
 {v:3,size:29,dataL:55,dataM:44,ecL:15,ecM:26,align:22},
 {v:4,size:33,dataL:80,dataM:64,ecL:20,ecM:36,align:26},
 {v:5,size:37,dataL:108,dataM:86,ecL:26,ecM:46,align:30}];
function fmtBits(ec,mask){const F={L:1,M:0,Q:3,H:2};let d=(F[ec]<<3)|mask,d2=d;
  for(let i=0;i<10;i++)d2=(d2<<1)^((d2>>>9)*0x537);return((d<<10)|d2)^0x5412;}
window.qrGenerate=function(text){
  const bytes=[];for(let i=0;i<text.length;i++){const c=text.charCodeAt(i);if(c>255)return null;bytes.push(c);}
  let ver=null,ec='M';
  for(const o of VER){if(bytes.length<=o.dataM-2){ver=o;ec='M';break;}if(bytes.length<=o.dataL-2){ver=o;ec='L';break;}}
  if(!ver)return null;
  const cap=ec==='M'?ver.dataM:ver.dataL,ecc=ec==='M'?ver.ecM:ver.ecL;
  const bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1);};
  put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
  for(let p=0xEC;data.length<cap;p=(p===0xEC)?0x11:0xEC)data.push(p);
  const total=data.concat(rsEnc(data,ecc));
  const size=ver.size,mod=[];for(let r=0;r<size;r++)mod.push(new Array(size).fill(null));
  const setF=(r,c,v)=>{if(r>=0&&r<size&&c>=0&&c<size)mod[r][c]=v;};
  function finder(r0,c0){for(let r=-1;r<8;r++)for(let c=-1;c<8;c++){const rr=r0+r,cc=c0+c;
    if(rr<0||rr>=size||cc<0||cc>=size)continue;
    setF(rr,cc,(r>=0&&r<=6&&c>=0&&c<=6&&(r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4)))?1:0);}}
  finder(0,0);finder(0,size-7);finder(size-7,0);
  for(let i=8;i<size-8;i++){setF(6,i,(i%2===0)?1:0);setF(i,6,(i%2===0)?1:0);}
  setF(4*ver.v+9,8,1);
  if(ver.align){const a=ver.align;for(let r=-2;r<=2;r++)for(let c=-2;c<=2;c++)setF(a+r,a+c,(Math.max(Math.abs(r),Math.abs(c))!==1)?1:0);}
  /* réservation des cellules d'infos de format AVANT placement des données */
  const fmtPos=[];for(let i=0;i<15;i++){let r1,c1,r2,c2;
    if(i<6){r1=i;c1=8;}else if(i<8){r1=i+1;c1=8;}else{r1=size-15+i;c1=8;}
    if(i<8){r2=8;c2=size-1-i;}else if(i<9){r2=8;c2=7;}else{r2=8;c2=15-i-1;}
    setF(r1,c1,0);setF(r2,c2,0);fmtPos.push([r1,c1],[r2,c2]);}
  setF(size-8,8,1);
  /* placement zigzag + masque 0 */
  let bitIdx=7,byteIdx=0;
  const getBit=()=>{if(byteIdx>=total.length)return 0;const b=total[byteIdx];const bit=(b>>>bitIdx)&1;bitIdx--;if(bitIdx<0){bitIdx=7;byteIdx++;}return bit;};
  let row=size-1,inc=-1;
  for(let col=size-1;col>0;col-=2){
    if(col===6)col--;
    while(true){for(let k=0;k<2;k++){const cc=col-k;
      if(mod[row][cc]===null)mod[row][cc]=getBit()^((row+cc)%2===0?1:0);}
      row+=inc;if(row<0||row>=size){row-=inc;inc=-inc;break;}}}
  const fb=fmtBits(ec,0),fbit=i=>(fb>>>i)&1;
  fmtPos.forEach(([r,c],idx)=>setF(r,c,fbit(idx%15)));
  setF(size-8,8,1);
  return mod;};
})();
/* ---------------- QR helper (local → CDN si présent → null) ---------------- */
function qrURL(text,size){
  size=size||110;
  const render=(mat)=>{const n=mat.length;const c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);
    const q=Math.max(1,Math.floor(size/(n+8))),off=Math.floor((size-q*n)/2);
    x.fillStyle='#111';for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(mat[r][cc])x.fillRect(off+cc*q,off+r*q,q,q);
    return c.toDataURL();};
  try{const m=window.qrGenerate(text);if(m)return render(m);}catch(e){}
  try{if(typeof qrcode==='function'){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();
    const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,size,size);const cell=size/n;x.fillStyle='#111';
    for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(q.isDark(r,cc))x.fillRect(Math.floor(cc*cell),Math.floor(r*cell),Math.ceil(cell),Math.ceil(cell));
    return c.toDataURL();}}catch(e){}
  return null;}
function docScanURL(numero){const base=location.origin==='null'||location.protocol==='file:'?location.href.split('?')[0]:location.origin+location.pathname;return base+'?scan='+encodeURIComponent(numero);}
/* ---------------- Stockage ---------------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){toast('Stockage plein — exportez une sauvegarde','err');return false;}},del(k){localStorage.removeItem(k);}};
const COLLECTIONS=['parcels','crops','works','farms','barns','animals','feed','waste','poultry','cages',
'eggProduction','eggMovements','vetRecords','labAnalyses','purchases','shopSales','products',
'accounting','budgets','staff','leaves','materials','documents','trainings','enrollments',
'projects','tasks','news','gallery','rewards','climate','envActions','greenSpaces','protectedAreas',
'aquaculture','insects','insectHabitats','agroforestry','payrolls'];
const DEFAULT_SETTINGS={nom:'',sigle:'',slogan:'',description:'',adresse:'',ville:'',region:'',pays:'',
  telephone:'',email:'',site:'',reseaux:'',enregistrement:'',fiscal:'',dateCreation:'',responsable:'',president:'',
  logo:'',cachet:'',signatures:[],dirigeants:''};
const DEFAULT_PUB={pri:'#16a34a',pri2:'#052e16',acc:'#f59e0b',radius:14,btn:'gradient',
  heroImage:'',heroTitre:'Bienvenue sur {nom}',heroSlogan:'L\'excellence agricole au service du développement durable',
  intro:'Plateforme complète de gestion agricole, élevage, aviculture, aquaculture, apiculture, agroforesterie, formation et environnement.',
  flottants:'🌾,🐄,🐔,🐟,🐝,🌻,🌽,🍅,🥚,🌲,🦆,🐐',
  secActivites:1,secRealisations:1,secBoutique:1,secNews:1,secContact:1,boutiquePublique:1,
  marquee:'Agriculture 🌾 · Élevage 🐄 · Aviculture 🐔 · Aquaculture 🐟 · Apiculture 🐝 · Agroforesterie 🌲 · Formation 🎓 · Environnement 🌿',
  footerTexte:'',btnShape:'pill',animLevel:'rich',font:'Segoe UI',bgImage:'',realisationsBg:''};
function meta(){return store.get('agri_meta',{users:[],assocs:[],counters:{},activity:[]});}
function saveMeta(m){store.set('agri_meta',m);}
function data(){const d=store.get('agri_data_'+state.assocId,{});COLLECTIONS.forEach(c=>{if(!Array.isArray(d[c]))d[c]=[];});d.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});d.settings.pub=Object.assign({},DEFAULT_PUB,d.settings.pub||{});return d;}
function saveAll(d){store.set('agri_data_'+state.assocId,d);}
function logActivity(action,mod){const m=meta();m.activity.unshift({user:state.user?state.user.username:'—',action,module:mod||state.route,date:nowStr()});m.activity=m.activity.slice(0,500);saveMeta(m);}
function nextNumber(key,prefix){const m=meta();const k=state.assocId+':'+key;m.counters[k]=(m.counters[k]||0)+1;saveMeta(m);return prefix+'-'+state.year+'-'+String(m.counters[k]).padStart(4,'0');}
let state={user:null,assocId:null,year:String(new Date().getFullYear()),route:'dashboard',q:''};
const listState={};
function ls(key){if(!listState[key])listState[key]={q:'',page:1,sort:null,dir:1};return listState[key];}
/* ---------------- Rôles & permissions ---------------- */
const ROLE_LABELS={super:'Super administrateur',admin:'Administrateur',directeur:'Directeur / Président',comptable:'Comptable',
agricole:'Responsable agricole',agronome:'Agronome',elevage:'Responsable élevage',veterinaire:'Vétérinaire',
laboratoire:'Technicien laboratoire',rh:'Responsable RH',materiel:'Responsable matériel',formateur:'Formateur',
'secrétaire':'Secrétaire / Communication',projet:'Gestionnaire de projet',vendeur:'Vendeur / Caissier',user:'Utilisateur simple'};
const ALLMODS=['dashboard','alerts','settings','users','activity','backup','assocs','parcels','crops','works',
'farms','barns','animals','feed','waste','poultry','cages','eggProduction','eggMovements','vetRecords','labAnalyses',
'purchases','products','shop','shopSales','accounting','budgets','staff','leaves','hrdocs','cards','materials',
'documents','reports','certs','trainings','enrollments','projects','tasks','news','gallery','rewards',
'publicsite','climate','envActions','greenSpaces','protectedAreas','aquaculture','insects','insectHabitats',
'agroforestry','payrolls'];
const ROLE_PERMS={
  super:['*'],admin:['*'],
  directeur:ALLMODS,
  president:['dashboard','alerts','leaves','staff','reports','publicsite','news','gallery'],
  comptable:['dashboard','purchases','accounting','budgets','payrolls','documents','products','shopSales'],
  agricole:['dashboard','alerts','parcels','crops','works','feed','waste','materials','climate','envActions','greenSpaces','protectedAreas','agroforestry','reports'],
  agronome:['dashboard','parcels','crops','works','labAnalyses','climate','envActions','greenSpaces','protectedAreas','agroforestry','reports'],
  elevage:['dashboard','alerts','farms','barns','animals','feed','poultry','cages','eggProduction','eggMovements','waste','aquaculture','insects','insectHabitats'],
  veterinaire:['dashboard','animals','poultry','vetRecords','reports'],
  laboratoire:['dashboard','labAnalyses','reports'],
  rh:['dashboard','staff','leaves','hrdocs','cards','payrolls','documents'],
  materiel:['dashboard','materials','cages','insectHabitats','documents'],
  formateur:['dashboard','trainings','enrollments','certs','reports'],
  'secrétaire':['dashboard','documents','news','gallery','rewards','publicsite','reports'],
  projet:['dashboard','projects','tasks','reports'],
  vendeur:['dashboard','shop','products','shopSales','clients'],
  user:['dashboard','leaves']
};
function can(mod){if(!state.user)return false;const p=ROLE_PERMS[state.user.role]||[];return p.includes('*')||p.includes(mod);}
function canEdit(mod){return can(mod)&&state.user&&state.user.role!=='user';}
/* Publier sur le site vitrine : personnel autorisé par l'admin */
function canPublishSite(){return state.user&&['super','admin','secrétaire','directeur'].includes(state.user.role);}
function canDesignSite(){return state.user&&['super','admin'].includes(state.user.role);}
/* Approuver les permissions : directeur / président / admin / super */
function canApproveLeaves(){return state.user&&['super','admin','directeur','president'].includes(state.user.role);}
function canManageUsers(){return state.user&&['super','admin'].includes(state.user.role);}

/* ================================================================
   MODULES (moteur CRUD générique)

function sumBy(coll,fn){return (data()[coll]||[]).reduce((a,x)=>a+(fn(x)||0),0);}
function cageStats(cage){const q=sumBy('poultry',p=>p.cageId===cage.id&&p.statut!=='Vendu'?num(p.quantite):0);const cap=num(cage.capacite);return{n:q,dispo:Math.max(0,cap-q),taux:cap>0?Math.round(q/cap*100):0};}
function eggStockCalc(){const d=data();let prod=0,sold=0;d.eggProduction.forEach(e=>{prod+=num(e.nombre)-num(e.casses);sold+=num(e.vendus);});let mv=0;d.eggMovements.forEach(m=>{const s=m.type==='Perte'||m.type==='Sortie'||m.type==='Vente'?-1:1;mv+=s*num(m.quantite);});return{prod,sold,stock:Math.max(0,prod-sold+mv)};}
function netPay(i){return num(i.netAPayer)||(num(i.salaireBase)+num(i.heuresSup)*num(i.tauxHeureSup)+num(i.primes)+num(i.avantages)-num(i.deductions)-num(i.cotisations)-num(i.impot));}

function computeAlerts(){const d=data();const out=[];const now=new Date();const soon=n=>{const t=new Date(now.getTime()+n*86400000);return t.toISOString().slice(0,10);};
  (d.feed||[]).forEach(f=>{if(num(f.quantite)<=num(f.seuilMin))out.push({level:'r',msg:'Stock faible : '+f.nom+' ('+fmt(f.quantite)+' '+f.unite+')',link:'feed'});if(f.dateExpiration&&f.dateExpiration<=soon(30)&&f.dateExpiration>=today())out.push({level:'a',msg:'Aliment expirant : '+f.nom+' ('+f.dateExpiration+')',link:'feed'});});
  (d.products||[]).forEach(p=>{if(num(p.stock)<=num(p.seuil))out.push({level:'r',msg:'Boutique — stock faible : '+p.nom+' ('+fmt(p.stock)+' '+p.unite+')',link:'products'});});
  (d.cages||[]).forEach(c=>{const s=cageStats(c);if(num(c.capacite)>0&&s.n>num(c.capacite))out.push({level:'r',msg:'Capacité dépassée : cage '+c.numero,link:'cages'});else if(s.taux>=90)out.push({level:'a',msg:'Cage '+c.numero+' presque pleine ('+s.taux+'%)',link:'cages'});});
  (d.vetRecords||[]).forEach(v=>{if(v.prochainRdv&&v.prochainRdv>=today()&&v.prochainRdv<=soon(7))out.push({level:'a',msg:'Rappel vétérinaire le '+v.prochainRdv,link:'vetRecords'});});
  (d.shopSales||[]).forEach(s=>{const reste=num(s.total)-num(s.paye);if(reste>0&&yearOf(s.date)===state.year)out.push({level:'r',msg:'Vente impayée '+s.numero+' — '+s.client+' : '+fmtM(reste),link:'shopSales'});});
  (d.enrollments||[]).forEach(e=>{const reste=Math.max(0,num(e.frais)-num(e.reduction)-num(e.montantPaye));if(reste>0)out.push({level:'a',msg:'Paiement formation en retard : '+e.nom+' '+e.prenom,link:'enrollments'});});
  (d.projects||[]).forEach(p=>{if(p.dateFin&&p.dateFin<today()&&p.statut!=='Terminé'&&p.statut!=='Annulé')out.push({level:'r',msg:'Projet en retard : '+p.nom,link:'projects'});});
  (d.parcels||[]).forEach(f=>{if(f.dateRecoltePrevue&&f.dateRecoltePrevue>=today()&&f.dateRecoltePrevue<=soon(7))out.push({level:'g',msg:'Récolte proche : '+f.nom+' ('+(f.cultureActuelle||'')+') le '+f.dateRecoltePrevue,link:'parcels'});});
  (d.tasks||[]).forEach(t=>{if(t.dateEcheance&&t.dateEcheance<today()&&t.statut!=='Terminée')out.push({level:'r',msg:'Tâche en retard : '+t.titre,link:'tasks'});});
  (d.greenSpaces||[]).forEach(g=>{if(g.dateProchainEntretien&&g.dateProchainEntretien>=today()&&g.dateProchainEntretien<=soon(14))out.push({level:'a',msg:'Entretien espace vert proche : '+g.nom,link:'greenSpaces'});});
  (d.protectedAreas||[]).forEach(z=>{if(z.statut==='En péril')out.push({level:'r',msg:'Zone protégée en péril : '+z.nom,link:'protectedAreas'});else if(z.dateRevue&&z.dateRevue>=today()&&z.dateRevue<=soon(30))out.push({level:'a',msg:'Revue de zone protégée : '+z.nom,link:'protectedAreas'});});
  (d.leaves||[]).forEach(l=>{if(l.statut==='Demandé'&&canApproveLeaves())out.push({level:'a',msg:'Permission à valider : '+pageLabel_ref(l,'staffId'),link:'leaves'});});
  (d.insectHabitats||[]).forEach(h=>{if(h.maintenance&&h.maintenance<today()&&h.statut!=='Vendu')out.push({level:'a',msg:'Maintenance ruche/habitat '+h.numero+' à effectuer',link:'insectHabitats'});});
  return out;}

function scanFile(input){const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{try{new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e']}).detect(img).then(cs=>{if(cs.length)A.scanFound(cs[0].rawValue);else toast('Aucun code lisible sur cette image','err');}).catch(()=>toast('Lecture impossible','err'));}catch(err){toast('Navigateur incompatible','err');}};img.src=e.target.result;};r.readAsDataURL(f);}

const cart=[];
function renderShop(){if(!can('shop')){$('#view').innerHTML='<div class="empty"><div class="big">🔒</div>Accès réservé au personnel de la boutique.</div>';return;}
  const d=data();const st=ls('shop');

  if(st.cat)prods=prods.filter(p=>p.categorie===st.cat);

  h+='<div class="pos-grid"><div><div class="panel"><div class="toolbar"><input type="text" placeholder="Rechercher un article ou saisir un code-barre…" value="'+esc(st.q||'')+'" oninput="A.shopQ(this.value)" style="flex:1;min-width:170px" id="shopSearch"><select onchange="A.shopCat(this.value)"><option value="">Toutes catégories</option>'+cats.map(c=>'<option '+(st.cat===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><button class="btn btn-b" onclick="A.startScanner()">Scanner code-barre / QR</button></div>';
  if(!prods.length){h+='<div class="empty"><div class="big">🧺</div>Aucun article. Créez des articles dans le module « Articles de la boutique ».</div></div></div>';}
  else{h+='<div class="prod-grid">'+prods.map(p=>{const stock=num(p.stock);const cls=stock<=0?' out':'';return '<div class="prod-card'+cls+'" onclick="A.addToCart(\''+p.id+'\')">'+(p.congele==='Oui'?'<span class="frz">❄</span>':'')+(p.photo&&p.photo[0]?'<img src="'+p.photo[0]+'">':'')+'<div class="pn">'+esc(p.nom)+'</div><div class="pp">'+fmtM(p.prixVente)+' <span style="font-size:10.5px;color:var(--muted)">/ '+esc(p.unite)+'</span></div><div class="stk">Stock : '+fmt(stock)+(num(p.stock)<=num(p.seuil)?' ⚠️':'')+'</div></div>';}).join('')+'</div></div>';}
  h+='<div class="panel cart-box"><h3>🧾 Panier — encaissement</h3>';
  h+=renderCartHTML();
  h+='</div></div>';

function renderCartHTML(){const d=data();
  if(!cart.length)return '<div class="empty"><div class="big">🛒</div>Panier vide — cliquez sur un article ou scannez un code-barre.</div>';
  let total=0;
  let h='<div class="table-wrap"><table class="cart-table"><thead><tr><th>Article</th><th>Qté</th><th>P.U.</th><th>Montant</th><th></th></tr></thead><tbody>';
  cart.forEach((c,i)=>{const p=d.products.find(x=>x.id===c.id);if(!p)return;const m=num(c.qty)*num(p.prixVente);total+=m;
    h+='<tr><td><b>'+esc(p.nom)+'</b><br><small style="color:var(--muted)">'+esc(p.unite)+'</small></td><td><input type="number" min="0.01" step="any" value="'+c.qty+'" onchange="A.cartQty('+i+',this.value)"></td><td>'+fmt(p.prixVente)+'</td><td><b>'+fmtM(m)+'</b></td><td><button class="btn btn-x btn-d" onclick="A.cartRm('+i+')">×</button></td></tr>';});
  h+='</tbody></table></div>';
  const remise=num(cartState.remise||0);const net=Math.max(0,total-remise);
  h+='<div class="cart-total">Total : '+fmtM(total)+(remise?'<br><small style="color:var(--muted);font-size:12px">Remise : −'+fmtM(remise)+' → Net : '+fmtM(net)+'</small>':'')+'</div>';
  h+='<div class="form-grid"><div class="fg"><label>Client (facultatif)</label><input type="text" id="cartClient" value="'+esc(cartState.client||'')+'"></div>';
  h+='<div class="fg"><label>Remise (FCFA)</label><input type="number" min="0" value="'+(cartState.remise||0)+'" onchange="A.cartRemise(this.value)"></div>';
  h+='<div class="fg"><label>Mode de paiement</label><select id="cartMode">'+['Espèces','Virement','Chèque','Mobile Money','Crédit'].map(m=>'<option'+(cartState.mode===m?' selected':'')+'>'+m+'</option>').join('')+'</select></div>';
  h+='<div class="fg"><label>Montant reçu (FCFA)</label><input type="number" min="0" id="cartRecu" value="'+(cartState.recu??'')+'" placeholder="'+fmt(net)+'"></div></div>';
  h+='<div id="cartChange" class="hint" style="font-size:14px"></div>';
  h+='<div class="toolbar" style="margin-top:10px"><button class="btn btn-p" style="flex:1;justify-content:center;padding:13px;font-size:15px" onclick="A.checkout(false)">Encaisser & ticket</button><button class="btn btn-b" onclick="A.checkout(true)">Facture</button><button class="btn btn-d" onclick="A.cartClear()">Vider</button></div>';
  return h;}
const cartState={remise:0,mode:'Espèces',client:'',recu:''};
function shopQ(v){ls('shop').q=v;clearTimeout(qTimer);qTimer=setTimeout(renderShop,220);}
function shopCat(v){ls('shop').cat=v;renderShop();}
function cartFind(id){return cart.findIndex(c=>c.id===id);}
function addToCart(id,qty){const d=data();const p=d.products.find(x=>x.id===id);if(!p)return;
  if(num(p.stock)<=0){toast('Stock épuisé : '+p.nom,'err');return;}
  const i=cartFind(id);
  if(i>-1){if(num(p.stock)<num(cart[i].qty)+num(qty||1)){toast('Stock insuffisant ('+fmt(p.stock)+' '+p.unite+')','err');return;}cart[i].qty=num(cart[i].qty)+num(qty||1);}
  else{if(num(p.stock)<num(qty||1)){toast('Stock insuffisant','err');return;}cart.push({id,qty:num(qty||1)});}
  toast('➕ '+p.nom+' ×'+(qty||1),'ok');renderShop();}
function cartQty(i,v){const d=data();const p=d.products.find(x=>x.id===cart[i].id);
  if(num(v)<=0){cart.splice(i,1);renderShop();return;}
  if(p&&num(p.stock)<num(v)){toast('Stock insuffisant ('+fmt(p.stock)+' '+p.unite+')','err');renderShop();return;}
  cart[i].qty=num(v);renderShop();}
function cartRm(i){cart.splice(i,1);renderShop();}
function cartClear(){cart.length=0;cartState.remise=0;cartState.recu='';renderShop();}
function cartRemise(v){cartState.remise=num(v);renderShop();}
function checkout(facture){const d=data();if(!cart.length){toast('Panier vide','err');return;}
  cartState.client=$('#cartClient')?$('#cartClient').value.trim():'';cartState.mode=$('#cartMode')?$('#cartMode').value:'Espèces';
  cartState.recu=$('#cartRecu')?$('#cartRecu').value:'';
  let total=0;const lines=[];
  for(const c of cart){const p=d.products.find(x=>x.id===c.id);if(!p)continue;const m=num(c.qty)*num(p.prixVente);total+=m;
    lines.push({id:p.id,nom:p.nom,unite:p.unite,qty:num(c.qty),pu:num(p.prixVente),mt:m});}
  const remise=Math.min(num(cartState.remise),total);const net=total-remise;
  const recu=num(cartState.recu)||net;const rendu=Math.max(0,recu-net);
  if(recu<net&&cartState.mode!=='Crédit'){if(!confirm('Montant reçu inférieur au total. Vendre à crédit ?'))return;}
  const sale={id:uid(),numero:nextNumber('shopSales','VTE'),date:today(),client:cartState.client||'Client comptant',
    items:JSON.stringify(lines),total:net,paye:Math.min(recu,net),modePaiement:cartState.mode,vendeur:state.user.name||state.user.username};
  d.shopSales.unshift(sale);
  lines.forEach(l=>{const p=d.products.find(x=>x.id===l.id);if(p)p.stock=Math.max(0,(num(p.stock)-l.qty).toFixed(2));});
  d.accounting.unshift({id:uid(),date:today(),type:'Recette',categorie:'Vente boutique',libelle:'Vente '+sale.numero+' ('+sale.client+')',montant:sale.paye,mode:sale.modePaiement,tiers:sale.client,piece:sale.numero,auto:1});
  saveAll(d);logActivity('Vente boutique '+sale.numero,'shop');
  cart.length=0;cartState.remise=0;cartState.recu='';
  renderShop();toast('✅ Vente '+sale.numero+' enregistrée — '+fmtM(net),'ok');
  printReceipt(sale,lines,total,remise,recu,rendu);
  if(facture)setTimeout(()=>printInvoice(sale,lines,total,remise),400);}
function printReceipt(sale,lines,total,remise,recu,rendu){const s=data().settings;
  const rows=lines.map(l=>'<tr><td>'+esc(l.nom)+'<br><small>'+fmt(l.qty)+' '+esc(l.unite)+' × '+fmt(l.pu)+'</small></td><td style="text-align:right">'+fmt(l.mt)+'</td></tr>').join('');
  const qr=qrURL(docScanURL(sale.numero),90);
  printDoc('Ticket de caisse — '+sale.numero,
    '<p style="text-align:center"><b>'+esc(s.nom||'')+'</b> '+(s.sigle?'('+esc(s.sigle)+')':'')+'<br>'+esc([s.adresse,s.ville].filter(Boolean).join(', '))+'<br>Tél : '+esc(s.telephone||'')+'<br><small>'+esc(s.email||'')+'</small></p>'
    +'<hr><p>Ticket : <b>'+esc(sale.numero)+'</b> · '+nowStr()+'<br>Vendeur : '+esc(sale.vendeur)+' · Client : '+esc(sale.client)+'</p>'
    +'<table class="ptbl">'+rows+'<tr><td><b>Total</b></td><td style="text-align:right"><b>'+fmt(total)+'</b></td></tr>'+(remise?'<tr><td>Remise</td><td style="text-align:right">−'+fmt(remise)+'</td></tr>':'')+'<tr><td><b>NET À PAYER</b></td><td style="text-align:right"><b>'+fmt(num(sale.total))+' FCFA</b></td></tr><tr><td>Reçu ('+esc(sale.modePaiement)+')</td><td style="text-align:right">'+fmt(recu)+'</td></tr><tr><td>Monnaie rendue</td><td style="text-align:right">'+fmt(rendu)+'</td></tr></table>'

let scanStream=null;
function startScanner(){
  if(!('BarcodeDetector' in window)){manualCodeEntry();return;}
  openModal('<div class="modal-head"><h3>📷 Scanner code-barre / QR</h3><button class="modal-close" onclick="A.stopScanner()">×</button></div><div class="modal-body" style="text-align:center"><video id="scanVideo" style="width:100%;border-radius:10px;background:#000" autoplay playsinline></video><p class="hint">Pointez la caméra vers le code. Saisie manuelle possible ci-dessous.</p><p class="hint">Ou importez une photo du code : <input type="file" accept="image/*" onchange="A.scanFile(this)"></p><div class="toolbar" style="justify-content:center"><input type="text" id="scanManual" placeholder="Saisir le code ici…" onkeydown="if(event.key===\'Enter\')A.scanFound(this.value)"><button class="btn btn-p" onclick="A.scanFound(document.getElementById(\'scanManual\').value)">OK</button></div></div>');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{scanStream=stream;$('#scanVideo').srcObject=stream;
    const det=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e']});
    const tick=()=>{if(!scanStream)return;det.detect($('#scanVideo')).then(codes=>{if(codes.length){A.scanFound(codes[0].rawValue);return;}requestAnimationFrame(tick);}).catch(()=>requestAnimationFrame(tick));};
    setTimeout(tick,500);}).catch(()=>{manualCodeEntry();});}
function manualCodeEntry(){openModal('<div class="modal-head"><h3>⌨️ Saisie du code</h3><button class="modal-close" onclick="A.closeModal()">×</button></div><div class="modal-body"><p class="hint">Caméra indisponible ou non autorisée. Saisissez le code-barre / QR manuellement :</p><input type="text" id="scanManual2" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:9px;font-size:16px" onkeydown="if(event.key===\'Enter\')A.scanFound(this.value)"></div><div class="modal-foot"><button class="btn" onclick="A.closeModal()">Annuler</button><button class="btn btn-p" onclick="A.scanFound(document.getElementById(\'scanManual2\').value)">Rechercher</button></div>');setTimeout(()=>{const e=$('#scanManual2');if(e)e.focus();},100);}
function scanFound(code){if(!code)return;stopScanner();const d=data();

    toast('Code « '+code+' » introuvable','err');}}

function moduleItems(key){const cfg=MODULES[key];let items=(data()[key]||[]).slice();

  return items;}

function doImport(key,text,hasHeader){const cfg=MODULES[key];
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){toast('Fichier vide','err');return;}
  const delim=lines[0].split(';').length>=lines[0].split(',').length?';':',';
  const parse=l=>{const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){const c=l[i];
      if(q){if(c==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
      else if(c==='"')q=true;
      else if(c===delim){out.push(cur.trim());cur='';}
      else cur+=c;}
    out.push(cur.trim());return out;};
  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9àâäéèêëîïôöùûüç]/g,'');
  const cols=cfg.fields.filter(f=>f.t!=='files'&&f.t!=='ref');
  const headerIdx={};const first=parse(lines[0]);
  if(hasHeader){first.forEach((h,i)=>{const f2=cols.find(x=>norm(x.k)===norm(h)||norm(x.l)===norm(h));if(f2)headerIdx[i]=f2.k;});}
  else{cols.forEach((f2,i)=>{if(i<first.length)headerIdx[i]=f2.k;});}
  if(!Object.keys(headerIdx).length){toast('Aucune colonne reconnue — utilisez le bouton « Modèle CSV »','err');return;}
  const d=data();let nOk=0,nErr=0;const rows=hasHeader?lines.slice(1):lines;
  rows.forEach(l=>{const cells=parse(l);const obj={id:uid()};
    Object.entries(headerIdx).forEach(([i,k])=>{const f2=cfg.fields.find(x=>x.k===k);if(!f2)return;let v=cells[+i]??'';
      if(f2.t==='number')v=num(v);
      if(f2.t==='select'&&f2.o&&v&&!f2.o.includes(v))v='';
      obj[k]=v;});
    const missing=cfg.fields.filter(f2=>f2.req&&!obj[f2.k]);
    if(missing.length){nErr++;return;}
    if(cfg.prefix&&!obj.matricule)obj.matricule=nextNumber(key,cfg.prefix);
    ['numero','code'].forEach(n=>{if(obj[n]===undefined||obj[n]==='')obj[n]=obj.matricule;});
    d[key].unshift(obj);nOk++;});
  saveAll(d);closeModal();logActivity('Import de liste : '+nOk+' ligne(s) dans '+cfg.title,key);
  toast('Import terminé : '+nOk+' ligne(s) ajoutée(s)'+(nErr?' · '+nErr+' rejetée(s) (obligatoires manquants)':'')+(hasHeader?'':' · en-têtes absents : ordre du modèle supposé'),nErr?'err':'ok');
  renderRoute();}

function openSignPad(cbName,onDone){
  openModal('<div class="modal-head"><h3>✍️ Signature électronique</h3><button class="modal-close" onclick="A.closeModal()">×</button></div><div class="modal-body"><p class="hint">Signez à la souris ou du doigt (écran tactile).</p><canvas id="signCanvas" style="width:100%;height:180px;border:2px solid #bbb;border-radius:8px;background:#fff;cursor:crosshair;touch-action:none"></canvas></div><div class="modal-foot"><button class="btn" onclick="A.closeModal()">Annuler</button><button class="btn btn-d" onclick="A.clearSign()">Effacer</button><button class="btn btn-p" onclick="A.saveSign()">Valider</button></div>');
  const cvs=$('#signCanvas'),ctx=cvs.getContext('2d');const rect=cvs.getBoundingClientRect();cvs.width=rect.width;cvs.height=rect.height;ctx.strokeStyle='#14532d';ctx.lineWidth=2;ctx.lineCap='round';let drawing=false;
  const getPos=e=>{const r=cvs.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x,y};};
  const start=e=>{drawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  const move=e=>{if(!drawing)return;e.preventDefault();const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
  const end=()=>drawing=false;
  cvs.addEventListener('mousedown',start);cvs.addEventListener('mousemove',move);cvs.addEventListener('mouseup',end);cvs.addEventListener('mouseleave',end);
  cvs.addEventListener('touchstart',start,{passive:false});cvs.addEventListener('touchmove',move,{passive:false});cvs.addEventListener('touchend',end);
  window._signCallback=cbName;window._signDone=onDone||null;}
function clearSign(){const cvs=$('#signCanvas');if(cvs){const ctx=cvs.getContext('2d');ctx.clearRect(0,0,cvs.width,cvs.height);}}
function saveSign(){const cvs=$('#signCanvas');if(!cvs)return;const png=cvs.toDataURL('image/png');closeModal();
  if(window._signCallback==='settings'){const d=data();d.settings.signatures=d.settings.signatures||[];d.settings.signatures.push({label:'Signature électronique '+nowStr(),img:png});saveAll(d);renderSettings();toast('Signature enregistrée dans les paramètres','ok');}
  else{window._lastSignData=png;toast('Signature capturée ✔','ok');}
  if(window._signDone){const f=window._signDone;window._signDone=null;f();}}

let idleTimer=null;
const IDLE_LIMIT=5*60*1000;
function resetIdle(){clearTimeout(idleTimer);if(state.user){idleTimer=setTimeout(sessionExpire,IDLE_LIMIT);}}
function sessionExpire(){if(!state.user)return;softLogout('Session expirée — 5 minutes sans activité. Reconnexion nécessaire.');}
function softLogout(msg){clearTimeout(idleTimer);try{sessionStorage.removeItem('agri_session');}catch(e){}store.del('agri_session');
  state.user=null;state.assocId=null;
  $('#appView').style.display='none';$('#loginView').classList.add('hidden');$('#publicSite').classList.remove('hidden');
  renderPublicSite();if(window.scrollTo)window.scrollTo(0,0);
  if(msg)toast(msg,'err');}
